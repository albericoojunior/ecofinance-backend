
services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecofinance
    ports:
      - 5432:5432

  api:
    build: .
    container_name: ecofinance-backend
    restart: always
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      - db